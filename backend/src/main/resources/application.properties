spring.application.name=beneficiary-system-v2
spring.datasource.url=jdbc:mysql://localhost:3306/beneficiary_system_v2?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.uploads.directory=${APP_UPLOADS_DIRECTORY:uploads}
app.ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
app.gemini.api-key=${GEMINI_API_KEY}
spring.devtools.restart.enabled=false